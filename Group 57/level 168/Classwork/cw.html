<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="./cw.css">
</head>
<body>
    <div class="weather-cont">
     
        <div class="weather-inf">
            <p>16</p>
            <div class="city">
                <p>london</p>
                <div class="date">
                    <p>06:09 - Monday, 9 Sep '23</p>
                </div>
            </div>
        <img src="" alt="">
        </div>


    <div class="details-list">
        <div class="search-bx">
            <input type="text" placeholder="Search Location...">
            <img src="./search-icon.png" alt="">
        </div>

        <p>Weather Details...</p>

        <p>ThunderStorm With Light drizzle</p>

        <div class="details-list">
            <div>
                <p>Temp max</p>
                <p>19</p>
            </div>
            <div>
                <p>Temp min</p>
                <p>15</p>
            </div>
            <div>
                <p>Humidity</p>
                <p>58%</p>
            </div>
            <div>
                <p>Cloudy</p>
                <p>86%</p>
            </div>
            <div>
                <p>Wind</p>
                <p>5km/h</p>
            </div>
        </div>
    </div>

    </div>

    <script src="cw.js"></script>
</body>
</html>
